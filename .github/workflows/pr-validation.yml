name: Develop/Main PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every check runs the base branch's copy of scripts/ and gate/ against the PR's apps,
# so a PR is graded by the rules it targets, not by rules it edits. Changes to those
# rules (and to this file) need a code owner's review; see .github/CODEOWNERS.
#
# pull_request, never pull_request_target: a fork's code runs here, so this workflow
# holds no secrets and needs none.

env:
  # The deploy engine runs on Node 22 (node:22-slim), so synth runs on it here too. The
  # scripts and the gate are TypeScript run by Node's type stripping, which needs 22.18+.
  NODE_VERSION: "22"
  # Pinned to the versions the deploy engine uses, so the gate and the synth match it.
  CDK_CLI_VERSION: "2.1143.0"

jobs:
  # Cheap checks that need no install: required files, tool.json shape, README table.
  catalogue:
    name: Catalogue Conventions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out the checks from the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: scripts

      # A PR that adds a check runs it before it lands; files the base branch already has
      # are never replaced, so a PR cannot change a check that exists. Only new files come
      # from the PR, and the workflow that runs them needs a code owner's review.
      - name: Add checks the base branch does not have yet
        run: |
          find scripts -type f | while read -r file; do
            if [ ! -e ".base/$file" ]; then
              echo "::warning::The base branch has no $file; using the PR's copy."
              mkdir -p ".base/$(dirname "$file")" && cp "$file" ".base/$file"
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check every app against the conventions
        run: node .base/scripts/check-catalogue.ts .

  # The repository is TypeScript only. Biome lints and formats the TypeScript and JSON
  # (biome.json), tsc type-checks scripts/ and gate/ (tsconfig.json; each app has its
  # own, checked in the pre-flight job), and actionlint checks the workflows.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: No JavaScript
        run: |
          js=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx')
          if [ -n "$js" ]; then
            echo "::error::This repository is TypeScript only. Convert these files:"
            echo "$js"
            exit 1
          fi

      - name: Install tooling
        run: npm ci

      - name: Biome
        run: npx biome ci --reporter=github

      - name: Type-check
        run: npx tsc -p .

      - name: actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color
        env:
          ACTIONLINT_VERSION: "1.7.12"

  # Which apps the pre-flight gate grades. A PR into develop grades the apps it changed,
  # or every app when it changes what they share (the gate, the scripts, the workflows,
  # the root tooling); see scripts/changed-apps.ts. A PR into main grades every app, so
  # each promotion to production is checked in full, including stacks a stricter gate
  # would now reject.
  discover:
    name: Discover Apps
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The merge base with the base branch, to diff against.
          fetch-depth: 0

      - name: Check out the scripts from the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: scripts

      # See the same step in the catalogue job.
      - name: Add checks the base branch does not have yet
        run: |
          find scripts -type f | while read -r file; do
            if [ ! -e ".base/$file" ]; then
              echo "::warning::The base branch has no $file; using the PR's copy."
              mkdir -p ".base/$(dirname "$file")" && cp "$file" ".base/$file"
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - id: apps
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            apps=$(node .base/scripts/changed-apps.ts)
          else
            apps=$(node .base/scripts/changed-apps.ts "$BASE_SHA")
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # The SF-441 pre-flight gate over every deploy-form variant of each app Discover Apps
  # picked. Skipped when it picked none, e.g. a docs-only PR.
  preflight:
    name: Pre-flight (${{ matrix.app }})
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out the gate from the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: |
            scripts
            gate

      # See the same step in the catalogue job.
      - name: Add checks the base branch does not have yet
        run: |
          find scripts gate -type f | while read -r file; do
            if [ ! -e ".base/$file" ]; then
              echo "::warning::The base branch has no $file; using the PR's copy."
              mkdir -p ".base/$(dirname "$file")" && cp "$file" ".base/$file"
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: npx tsc --noEmit

      - name: Synthesise every variant and run the gate
        run: node .base/scripts/preflight.ts apps/${{ matrix.app }}

      # Pinned, still published, and how far behind upstream (a warning, not a failure).
      # Reads the images from the templates the step above synthesised.
      - name: Check the container images
        if: success() || failure()
        run: node .base/scripts/check-images.ts apps/${{ matrix.app }}

  # One check to require in branch protection, whatever apps the matrix expands to.
  gate:
    name: Pre-flight Gate
    if: always()
    needs:
      - catalogue
      - lint
      - discover
      - preflight
    runs-on: ubuntu-24.04
    steps:
      # Pre-flight may be skipped (no app to grade); every other job must succeed.
      - name: Every job passed
        env:
          CATALOGUE: ${{ needs.catalogue.result }}
          LINT: ${{ needs.lint.result }}
          DISCOVER: ${{ needs.discover.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
        run: |
          echo "catalogue=$CATALOGUE lint=$LINT discover=$DISCOVER preflight=$PREFLIGHT"
          for result in "$CATALOGUE" "$LINT" "$DISCOVER"; do
            [ "$result" = "success" ] || { echo "::error::A validation job did not pass ($result)."; exit 1; }
          done
          case "$PREFLIGHT" in
            success | skipped) ;;
            *) echo "::error::Pre-flight did not pass ($PREFLIGHT)."; exit 1 ;;
          esac
