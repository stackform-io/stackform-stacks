name: Develop/Main PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every check runs the base branch's copy of scripts/ and gate/ against the PR's apps,
# so a PR is graded by the rules it targets, not by rules it edits. Changes to those
# rules (and to this file) need a code owner's review; see .github/CODEOWNERS.
#
# pull_request, never pull_request_target: a fork's code runs here, so this workflow
# holds no secrets and needs none.

env:
  # The deploy engine runs on Node 22 (node:22-slim), so synth runs on it here too. The
  # scripts and the gate are TypeScript run by Node's type stripping, which needs 22.18+.
  NODE_VERSION: "22"
  # Pinned to the versions the deploy engine uses, so the gate and the synth match it.
  CDK_CLI_VERSION: "2.1143.0"

jobs:
  # Cheap checks that need no install: required files, tool.json shape, README table.
  catalogue:
    name: Catalogue Conventions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out the checks from the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: scripts

      # Only while a base branch predates these checks (the PR that adds them, and the
      # first promotion to main). A PR cannot remove them from its base, so once they
      # land this never runs again.
      - name: Fall back to the PR's checks if the base branch has none
        run: |
          if [ ! -f .base/scripts/check-catalogue.ts ]; then
            echo "::warning::The base branch has no scripts/check-catalogue.ts; using the PR's copy."
            rm -rf .base && mkdir .base && cp -r scripts .base/
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check every app against the conventions
        run: node .base/scripts/check-catalogue.ts .

  # The repository is TypeScript only. Biome lints and formats the TypeScript and JSON
  # (biome.json), tsc type-checks scripts/ and gate/ (tsconfig.json; each app has its
  # own, checked in the pre-flight job), and actionlint checks the workflows.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: No JavaScript
        run: |
          js=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx')
          if [ -n "$js" ]; then
            echo "::error::This repository is TypeScript only. Convert these files:"
            echo "$js"
            exit 1
          fi

      - name: Install tooling
        run: npm ci

      - name: Biome
        run: npx biome ci --reporter=github

      - name: Type-check
        run: npx tsc -p .

      - name: actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color
        env:
          ACTIONLINT_VERSION: "1.7.12"

  discover:
    name: Discover Apps
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: apps
        run: echo "apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # The SF-441 pre-flight gate over every deploy-form variant of every app.
  #
  # Every app, on every PR, not only the changed ones: when gate/ tightens, a stack that
  # stopped passing should say so on the next PR rather than on its next edit.
  preflight:
    name: Pre-flight (${{ matrix.app }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out the gate from the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: |
            scripts
            gate

      # See the same step in the catalogue job.
      - name: Fall back to the PR's checks if the base branch has none
        run: |
          if [ ! -f .base/scripts/preflight.ts ] || [ ! -d .base/gate ]; then
            echo "::warning::The base branch has no scripts/preflight.ts or gate/; using the PR's copy."
            rm -rf .base && mkdir .base && cp -r scripts gate .base/
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: npx tsc --noEmit

      - name: Synthesise every variant and run the gate
        run: node .base/scripts/preflight.ts apps/${{ matrix.app }}

  # One check to require in branch protection, whatever apps the matrix expands to.
  gate:
    name: Pre-flight Gate
    if: always()
    needs:
      - catalogue
      - lint
      - discover
      - preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A validation job did not pass ($result)."; exit 1; }
          done
